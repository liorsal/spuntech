<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בקרת גליל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#161A1D;
    --slate-2:#22282C;
    --line:#333B41;
    --go:#12B76A;
    --stop:#E03B3B;
    --stop-deep:#93201F;
    --amber:#F5A524;
    --ink:#EDF1F3;
    --mute:#8A969E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--slate);
    font-family:'Heebo',system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,3.5vh,32px);
    padding:20px;
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 64px),
      repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 64px);
  }

  /* ---- counter ---- */
  .counter{position:relative;text-align:center;line-height:1}
  .counter .num{
    font-size:clamp(48px,14vw,86px);
    font-weight:900;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .counter .cap{
    display:block;margin-top:6px;
    font-size:clamp(10px,2.4vw,12px);font-weight:700;
    letter-spacing:.22em;color:var(--mute);
  }

  /* ---- dial ---- */
  .dial{
    position:relative;
    width:min(66vw,min(42vh,320px));
    aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
    font-family:inherit;display:grid;place-items:center;
    background:var(--stop);
    box-shadow:
      0 0 0 9px var(--slate-2),0 0 0 11px var(--line),
      0 20px 40px rgba(0,0,0,.55),
      inset 0 -12px 26px rgba(0,0,0,.32),
      inset 0 9px 24px rgba(255,255,255,.16);
    transition:background .22s ease,box-shadow .22s ease,transform .1s ease;
  }
  .dial:focus-visible{outline:4px solid #7FD3FF;outline-offset:14px}
  .dial:active{transform:translateY(4px) scale(.985)}
  .dial[data-state="go"]{
    background:var(--go);
    box-shadow:
      0 0 0 9px var(--slate-2),0 0 0 11px var(--line),
      0 20px 40px rgba(0,0,0,.55),0 0 64px rgba(18,183,106,.32),
      inset 0 -12px 26px rgba(0,0,0,.3),
      inset 0 9px 24px rgba(255,255,255,.2);
  }
  .dial .word{
    font-size:clamp(28px,8vw,54px);font-weight:900;line-height:.98;
    text-shadow:0 3px 0 rgba(0,0,0,.22);padding:0 10px;
  }

  /* ---- controls ---- */
  .bar{
    position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    justify-content:center;
  }
  .chip{
    background:var(--slate-2);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:13px;font-weight:700;
    padding:10px 16px;border-radius:999px;cursor:pointer;
    transition:border-color .15s ease,color .15s ease;
  }
  .chip:hover{border-color:var(--mute)}
  .chip:focus-visible{outline:3px solid #7FD3FF;outline-offset:3px}
  .chip.danger{color:#FF9C9C}

  .timerline{
    position:relative;display:flex;align-items:center;gap:9px;
    font-size:13px;font-weight:700;color:var(--mute);
    font-variant-numeric:tabular-nums;
  }
  .lamp{width:10px;height:10px;border-radius:50%;background:var(--stop-deep);
    box-shadow:0 0 12px rgba(224,59,59,.7);transition:background .2s,box-shadow .2s}
  .lamp[data-state="go"]{background:var(--go);box-shadow:0 0 12px rgba(18,183,106,.85)}

  select{
    background:var(--slate-2);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:13px;font-weight:700;
    padding:9px 12px;border-radius:10px;cursor:pointer;
  }

  /* ---- alert ---- */
  .veil{
    position:fixed;inset:0;z-index:20;display:none;
    place-items:center;padding:24px;
    background:rgba(10,12,14,.86);backdrop-filter:blur(6px);
  }
  .veil.on{display:grid}
  .card{
    background:var(--slate-2);border:2px solid var(--amber);
    border-radius:22px;padding:clamp(26px,6vw,40px);
    text-align:center;max-width:420px;width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    animation:pop .2s ease-out;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .card h2{font-size:clamp(26px,7vw,38px);font-weight:900;margin-bottom:10px}
  .card p{color:var(--mute);font-size:14px;font-weight:700;margin-bottom:22px}
  .card button{
    width:100%;background:var(--amber);color:#1A1204;border:none;
    font-family:inherit;font-size:17px;font-weight:900;
    padding:16px;border-radius:14px;cursor:pointer;
  }
  .card button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .dial,.lamp{transition:none}.dial:active{transform:none}.card{animation:none}
  }
</style>
</head>
<body>

  <div class="counter">
    <span class="num" id="count">0</span>
    <span class="cap">גלילים במשמרת</span>
  </div>

  <button class="dial" id="dial" data-state="stop" aria-pressed="false">
    <span class="word" id="word">לא בדיקה</span>
  </button>

  <p class="timerline">
    <span class="lamp" id="lamp" data-state="stop"></span>
    <span id="clock">תזכורת בעוד 30:00</span>
  </p>

  <div class="bar">
    <select id="interval" aria-label="מרווח תזכורת">
      <option value="10">כל 10 דקות</option>
      <option value="15">כל 15 דקות</option>
      <option value="30" selected>כל 30 דקות</option>
      <option value="60">כל שעה</option>
    </select>
    <button class="chip" id="undo">ביטול אחרון</button>
    <button class="chip danger" id="reset">איפוס משמרת</button>
  </div>

  <div class="veil" id="veil" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
    <div class="card">
      <h2 id="alertTitle">עשית בדיקה?</h2>
      <p>עברו <span id="elapsed">30</span> דקות מהבדיקה האחרונה</p>
      <button id="ack">בדקתי, המשך</button>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const dial=$('dial'), word=$('word'), lamp=$('lamp'), clock=$('clock'),
        countEl=$('count'), veil=$('veil'), ack=$('ack'), elapsed=$('elapsed'),
        intervalSel=$('interval'), resetBtn=$('reset'), undoBtn=$('undo');

  let go=false, count=0, minutes=30, deadline=Date.now()+minutes*60000;

  /* optional persistence — degrades silently when unavailable */
  const KEY='roll-check-shift';
  async function save(){
    try{ await window.storage.set(KEY, JSON.stringify({count,go})); }catch(e){}
  }
  async function load(){
    try{
      const r = await window.storage.get(KEY);
      if(r){ const d=JSON.parse(r.value); count=d.count||0; go=!!d.go; }
    }catch(e){}
    render();
  }

  function render(){
    const s = go?'go':'stop';
    dial.dataset.state=s; lamp.dataset.state=s;
    dial.setAttribute('aria-pressed',String(go));
    word.textContent = go?'בדיקה':'לא בדיקה';
    countEl.textContent = count;
  }

  function resetTimer(){ deadline = Date.now()+minutes*60000; }

  function tick(){
    const left = deadline-Date.now();
    if(left<=0){ if(!veil.classList.contains('on')) fire(); return; }
    const m=Math.floor(left/60000), sec=Math.floor(left%60000/1000);
    clock.textContent = `תזכורת בעוד ${m}:${String(sec).padStart(2,'0')}`;
  }

  function beep(){
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(.08,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+.5);
    }catch(e){}
  }

  function fire(){
    elapsed.textContent = minutes;
    veil.classList.add('on');
    clock.textContent = 'ממתין לאישור';
    ack.focus();
    beep();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }

  dial.addEventListener('click',()=>{
    go=!go; count++;
    resetTimer(); render(); save();
    if(navigator.vibrate) navigator.vibrate(30);
  });

  ack.addEventListener('click',()=>{
    veil.classList.remove('on');
    resetTimer(); tick();
  });

  intervalSel.addEventListener('change',e=>{
    minutes=+e.target.value; resetTimer(); tick();
  });

  undoBtn.addEventListener('click',()=>{
    if(count>0){ count--; go=!go; render(); save(); }
  });

  resetBtn.addEventListener('click',()=>{
    if(confirm('לאפס את מונה המשמרת?')){
      count=0; go=false; resetTimer(); render(); save(); tick();
    }
  });

  load();
  tick();
  setInterval(tick,1000);
</script>
</body>
</html>
